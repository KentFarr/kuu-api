# kuu-api production-style compose file.
#
# Three services run continuously: postgres, kuu-api, caddy. One service
# (migrate) is one-shot — invoke it on demand with:
#   docker compose run --rm migrate up
#
# Required on the host before `docker compose up -d`:
#   - A populated .env file (cp .env.example .env)
#   - DNS pointing api.your-domain.tld at this VPS (for Caddy TLS)
#   - Ports 80 and 443 open on the OVH firewall

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: kuu
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuu -d kuu"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Bound to localhost only — Postgres should not be reachable from the
    # public internet. kuu-api reaches it through the compose network.
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build: .
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/kuu-migrate"]
    # kuu-migrate currently shares config.Load() with kuu-api, so it
    # requires the same env vars even though it only touches the DB.
    # Loading .env keeps that working until we narrow migrate's config.
    env_file: .env
    environment:
      DATABASE_URL: postgres://kuu:${POSTGRES_PASSWORD}@postgres:5432/kuu?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  kuu-api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DATABASE_URL so it points at the compose-network postgres
      # rather than whatever's in .env. Keeps the .env file portable.
      DATABASE_URL: postgres://kuu:${POSTGRES_PASSWORD}@postgres:5432/kuu?sslmode=disable
      PORT: "8081"
      # Trust the reverse proxy so X-Forwarded-For is honored. The default
      # covers both layouts the deploy supports: Caddy on the docker bridge
      # (172.16.0.0/12 covers Docker's default bridge ranges) and an
      # external host-side reverse proxy (nginx, traefik, etc.) reaching
      # the API through the host loopback. .env may override this.
      TRUSTED_PROXY_CIDRS: "172.16.0.0/12,127.0.0.1/32"
    depends_on:
      postgres:
        condition: service_healthy
    # Bind to localhost only on the host so an external reverse proxy
    # (e.g. an existing nginx serving other sites on the same VPS) can
    # reach the API at 127.0.0.1:8081 without exposing it to the public
    # internet. The bundled Caddy container reaches the API over the
    # docker bridge using the service DNS name `kuu-api:8081` and is
    # unaffected by this binding.
    ports:
      - "127.0.0.1:8081:8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/kuu-api", "-h"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Bundled Caddy. Use this only when the host has no existing reverse
  # proxy on 80/443 — for example, a brand-new VPS dedicated to kuu-api.
  # Gated behind the "caddy" profile so a `docker compose up -d` on a
  # host that already runs nginx/traefik/etc. doesn't fail trying to bind
  # ports already in use. Bring up explicitly with:
  #   docker compose --profile caddy up -d caddy
  # See docs/DEPLOYMENT.md for the external-reverse-proxy alternative.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin Certificate for $KUU_API_DOMAIN. The host path
      # /etc/ssl/cloudflare must exist with origin.crt (0644) and
      # origin.key (0600) before `docker compose up -d`. See
      # docs/DEPLOYMENT.md § "Cloudflare Origin Certificate" for the
      # generation steps.
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      KUU_API_DOMAIN: ${KUU_API_DOMAIN:?KUU_API_DOMAIN is required (e.g. api.kuu.gg)}
    depends_on:
      - kuu-api

  # Off-host database backups. Gated behind the "backup" profile so the
  # service does not start until BACKUP_S3_* env vars are populated. Bring
  # it up explicitly with:
  #   docker compose --profile backup up -d backup
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    profiles: ["backup"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kuu:${POSTGRES_PASSWORD}@postgres:5432/kuu?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
