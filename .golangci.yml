version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
      # fakeptero is a local demo stand-in for the panel; logging the
      # request line is its whole purpose, and it never runs in production.
      - path: cmd/fakeptero/
        linters:
          - gosec
        text: G706

formatters:
  enable:
    - gofmt
