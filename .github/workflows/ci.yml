name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Enables the database integration tests in internal/database.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  demo:
    name: Demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start the demo
        run: make demo
      - name: Pay twice with the same event
        run: make demo-checkout ARGS="-repeat -email ci@example.com -username ci_player"
      - name: Check one server was provisioned
        run: |
          servers=$(curl -fsS -H "Authorization: Bearer demo" http://localhost:8090/api/application/servers | jq '.data | length')
          echo "servers on the fake panel: $servers"
          test "$servers" -eq 1
      - name: Check both emails arrived
        run: |
          # The panel's setup email is immediate; the welcome email waits
          # for the queue worker's next poll (up to 30s).
          for i in $(seq 1 45); do
            subjects=$(curl -fsS http://localhost:8025/api/v1/messages | jq -r '.messages[].Subject')
            if echo "$subjects" | grep -q "Account Created" && echo "$subjects" | grep -q "Your Kuu server is ready"; then
              echo "$subjects"
              exit 0
            fi
            sleep 1
          done
          echo "emails received:"; echo "$subjects"
          exit 1
      - name: Logs
        if: always()
        run: docker compose -f docker-compose.demo.yml logs --no-color kuu-api fakeptero
      - name: Tear down
        if: always()
        run: make demo-down
